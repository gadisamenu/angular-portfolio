<section id="work" class="projects glass-panel">
  <header class="projects__header">
    <div class="projects__heading">
      <ng-icon name="lucideMonitor" size="16" />
      <h2>Featured work</h2>
    </div>
    <button type="button" class="projects__view-all" (click)="viewAll()">
      View all projects
      <ng-icon name="lucideArrowRight" size="14" />
    </button>
  </header>

  <div class="projects__carousel">
    <button type="button" class="projects__arrow projects__arrow--prev" (click)="prev()" aria-label="Previous project">
      <ng-icon name="lucideChevronLeft" size="16" />
    </button>

    <div class="projects__grid">
      @for (project of visibleProjects(); track project.id) {
        <article class="project-card" (click)="openProject(project)" tabindex="0"
                 (keydown.enter)="openProject(project)">
          <div class="project-card__preview" [attr.data-variant]="project.images?.[0]">
            <img class="project-card__image" [src]="project.images?.[0]" [alt]="project.title + ' screenshot'" />
          </div>

          <div class="project-card__body">
            <h3>{{ project.title }}</h3>
            <p>{{ project.description }}</p>
            <div class="project-card__tags">
              @for (tag of project.tags; track tag) {
                <span>{{ tag }}</span>
              }
            </div>
          </div>
        </article>
      }
    </div>

    <button type="button" class="projects__arrow projects__arrow--next" (click)="next()" aria-label="Next project">
      <ng-icon name="lucideChevronRight" size="16" />
    </button>
  </div>
</section>
