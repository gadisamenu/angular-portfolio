<app-menu-bar />

<main class="desktop">
  <app-portfolio-nav />

  <app-hero />

  <div class="desktop__content">
    <app-about />
    <app-projects />

    <app-skills-section />
    <app-experience />

    <app-contact />
  </div>

  <footer class="desktop__footer">
    <p>© 2026 Gadisa Amenu. All rights reserved.</p>
    <p class="desktop__footer-credit">Powered by Angular</p>
  </footer>
</main>

@if (state.activeWindow() === 'finder') {
  <app-finder-window />
}
@if (state.activeWindow() === 'project') {
  <app-project-window />
}
@if (state.activeWindow() === 'resume') {
  <app-resume-window />
}
@if (state.activeWindow() === 'availability') {
  <app-availability-window />
}
@if (state.activeWindow() === 'preview') {
  <app-preview-window />
}
